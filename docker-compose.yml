services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: speakml
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  ml:
    build: ./model
    volumes:
      - storage:/app/storage
    restart: unless-stopped

  backend:
    build: ./speakml-backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://root:${DB_PASSWORD}@db:3306/speakml
      ML_MODE: http
      ML_SERVICE_URL: http://ml:8000
      STORAGE_TYPE: local
      STORAGE_PATH: /app/storage
      MAX_FILE_SIZE: 10485760
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  storage:
